# ==================================================================
#  XingJin-DripleafDupFixer  ——  残缺小型垂滴叶骨粉 Dup 修复
#  适用版本：Paper 1.17.1 ~ 1.21.3 / 服务端 Java 17+
# ------------------------------------------------------------------
#  漏洞原理：利用红石/活塞更新跳过器生成“只有上半段、下方不是
#  小型垂滴叶”的残缺方块，右键骨粉催熟触发幽灵方块，破坏时
#  无限掉落物品且方块不被移除，实现刷物品。
#  合法结构：上半段的正下方必须是小型垂滴叶（即完整的两格垂滴叶）；
#  单格下半段则必须有实际支撑方块。
# ------------------------------------------------------------------
#  通用说明：
#  1. 本文件所有配置项修改后，执行 /dripleafdup reload（或重启服）即可生效；
#  2. 支持的颜色代码：&0-&9、&a-&f、&k-&r（& 格式代码）；
#  3. 可用占位符（仅消息类配置项）：
#     %player%  触发者名称（定时清理时为“自动扫描”）
#     %uuid%    触发者 UUID（定时清理时为空）
#     %world%   方块所在世界名
#     %x% %y% %z%  方块坐标
#  4. 数值类配置配错时插件会自动夹取到安全范围，不会导致启动失败；
#  5. 文件编码必须为 UTF-8，否则中文消息会乱码。
# ==================================================================


# ------------------------------------------------------------------
#  一、基础开关
# ------------------------------------------------------------------

# [enable] 插件总开关
# 作用：false 时插件完全休眠——不监听骨粉交互、不拦截、不告警、不启动定时扫描
# 取值：true = 启用全部功能；false = 停用
# 默认：true
enable: true

# [notify-player] 是否给触发玩家发送提示消息
# 作用：拦截成功后按 player-message 的内容提示该玩家
# 取值：true = 发送；false = 静默拦截（只拦截不发消息）
# 默认：true
# 注意：此项只控制“文字提示”，音效与落雷由 effect-sound / effect-lightning 单独控制
notify-player: true

# [player-message] 玩家提示文本
# 作用：notify-player 为 true 时发送给触发玩家的内容
# 格式：字符串，支持 & 颜色代码与占位符（见文件顶部第 3 条）
# 默认："&c残缺垂滴叶禁止使用骨粉！这是刷物品BUG，请勿尝试！"
# 注意：内容为空字符串 "" 时不发送（等同 notify-player: false）
player-message: "&c残缺垂滴叶禁止使用骨粉！这是刷物品BUG，请勿尝试！"

# [notify-admin] 是否提醒在线管理员
# 作用：拦截成功 / 定时清理命中时，把 admin-message 推送给所有拥有
#       xingjin.dripleaf.admin 权限（默认 op）的在线玩家
# 取值：true = 推送；false = 不推送
# 默认：true
notify-admin: true

# [admin-message] 管理员告警文本
# 作用：notify-admin 为 true 时推送的内容
# 格式：字符串，支持 & 颜色代码与占位符（见文件顶部第 3 条）
# 默认："&e[修复] &f%player% &e试图对残缺垂滴叶使用骨粉 &7(%world% %x%, %y%, %z%)"
# 注意：玩家触发与定时清理共用此模板；定时清理时 %player% 显示为“自动扫描”
admin-message: "&e[修复] &f%player% &e试图对残缺垂滴叶使用骨粉 &7(%world% %x%, %y%, %z%)"


# ------------------------------------------------------------------
#  二、定时清理已存在的残缺（幽灵）方块
# ------------------------------------------------------------------

# [scan-ghost-block] 定时清理总开关
# 作用：开启后插件按 scan-interval 周期扫描全部世界已加载区块，
#       自动删除“残缺”结构的垂滴叶（悬浮上半段 / 无支撑下半段）
# 取值：true = 开启扫描；false = 不扫描（默认，仅靠实时拦截防刷）
# 默认：false
# 注意：只清理残缺结构，正常垂滴叶（完整两格 / 单格有支撑）不会被删除
scan-ghost-block: false

# [scan-interval] 扫描间隔
# 作用：两轮扫描之间的时间间隔
# 单位：秒
# 取值：任意正整数，低于 5 会自动夹取为 5，防止误配成 0 导致每 tick 全服扫描
# 默认：300（即 5 分钟一轮）
# 性能：扫描为异步流水线（主线程每 tick 拍 4 个区块快照 -> 异步遍历 -> 主线程每 tick
#       最多清理 128 个方块），不会造成卡顿尖峰；上一轮未结束时本轮自动跳过
scan-interval: 300


# ------------------------------------------------------------------
#  三、震慑特效（命中 BUG 行为、拦截成功时触发）
#  说明：特效每次拦截都会触发，不受告警冷却（1 秒/玩家）影响
# ------------------------------------------------------------------

# [effect-sound] 音效开关
# 作用：拦截成功时向触发玩家播放 effect-sound-name 指定的音效
# 取值：true = 播放；false = 不播放
# 默认：true
effect-sound: true

# [effect-sound-name] 音效 ID
# 作用：要播放的音效，写法与 /playsound 命令完全一致，
#       可带或不带 minecraft: 前缀（如 entity.wither.spawn）
# 常用震慑音效参考：
#   entity.wither.spawn            凋灵苏醒吼叫（默认，最有压迫感）
#   entity.ender_dragon.growl      末影龙咆哮
#   entity.elder_guardian.curse    远古守卫者诅咒
#   entity.lightning_bolt.thunder  雷声
#   entity.ghast.scream            恶魂尖叫
# 默认："entity.wither.spawn"
# 注意：填错 ID 不会报错，只是玩家听不到声音
effect-sound-name: "entity.wither.spawn"

# [effect-sound-volume] 音量
# 作用：音效音量。Minecraft 客户端响度上限为 1.0，
#       volume 超过 1 后声音不再变响，超出部分用于扩大可听范围（16 格 × volume），
#       因此默认 100 已是“能配到的最大值”
# 取值：任意非负小数
# 默认：100.0
effect-sound-volume: 100.0

# [effect-sound-pitch] 音调
# 作用：音效音调，小于 0.5 更低沉、大于 1.0 更尖锐
# 取值：0.5 ~ 2.0，超出部分自动夹取
# 默认：1.0
effect-sound-pitch: 1.0

# [effect-lightning] 落雷开关
# 作用：拦截成功时在触发玩家附近随机位置落雷（详见下方安全策略）
# 取值：true = 落雷；false = 不落雷
# 默认：true
effect-lightning: true

# [effect-lightning-effect-only] 雷电类型
# 作用：选择特效雷或真实雷
# 取值：
#   true  = 纯特效雷电（strikeLightningEffect）：有雷光与雷声，无伤害、不起火、不掉血，推荐
#   false = 真实雷电（strikeLightning）：对落雷点附近生物造成伤害，且可能起火引燃方块，
#           使用时请务必把 effect-lightning-safety-distance 调大（建议 >= 5）
# 默认：true
effect-lightning-effect-only: true

# [effect-lightning-radius] 落雷范围
# 作用：落雷点与玩家的水平距离上限，实际在 1 ~ 该值 之间随机取点
# 单位：格（方块）
# 取值：任意正小数，低于 1 自动夹取为 1
# 默认：8.0
effect-lightning-radius: 8.0

# [effect-lightning-safety-distance] 落雷安全距离
# 作用：落雷点周围该范围内不得存在任何生物（含触发玩家、怪物、动物），
#       检测不通过就换一个随机点重试，连续 10 次失败则放弃本次落雷（音效照常播放），
#       确保雷永远不会劈到玩家和生物
# 单位：格（方块），按轴对齐盒体检测
# 取值：任意正小数，低于 1 自动夹取为 1；使用真实雷电（上一项 false）时建议 >= 5
# 默认：3.0
effect-lightning-safety-distance: 3.0


# ------------------------------------------------------------------
#  四、Title 大标题 + Subtitle 副标题（屏幕中央）
# ------------------------------------------------------------------

# [title-enabled] Title 开关
# 作用：拦截成功时向触发玩家显示 Title（大标题）+ Subtitle（副标题）
# 取值：true = 显示；false = 不显示
# 默认：true
title-enabled: true

# [title-main] 大标题文本
# 作用：屏幕中央偏上的主标题
# 格式：字符串，支持 & 颜色代码与占位符
# 默认："&c&l检测到刷物品BUG行为"
title-main: "&c&l检测到刷物品BUG行为"

# [title-sub] 副标题文本
# 作用：大标题下方的副标题，可为空字符串 "" 表示不显示副标题
# 格式：字符串，支持 & 颜色代码与占位符
# 默认："&7残缺垂滴叶禁止使用骨粉"
title-sub: "&7残缺垂滴叶禁止使用骨粉"

# [title-fade-in] 淡入时间
# 作用：Title 从透明渐显到完全显示的时长
# 单位：tick（20 tick = 1 秒），0 表示直接出现
# 取值：0 ~ 600，超出自动夹取
# 默认：10
title-fade-in: 10

# [title-stay] 停留时间
# 作用：Title 完全显示后停留的时长
# 单位：tick，0 表示立即开始淡出
# 取值：0 ~ 600，超出自动夹取
# 默认：60（3 秒）
title-stay: 60

# [title-fade-out] 淡出时间
# 作用：Title 渐隐消失的时长
# 单位：tick，0 表示直接消失
# 取值：0 ~ 600，超出自动夹取
# 默认：20
title-fade-out: 20


# ------------------------------------------------------------------
#  五、ActionBar 物品栏上方提示条
# ------------------------------------------------------------------

# [action-bar-enabled] ActionBar 开关
# 作用：拦截成功时在触发玩家物品栏上方显示提示条
# 取值：true = 显示；false = 不显示
# 默认：true
action-bar-enabled: true

# [action-bar-message] ActionBar 文本
# 作用：提示条显示的内容
# 格式：字符串，支持 & 颜色代码与占位符
# 默认："&c残缺垂滴叶禁止使用骨粉！请勿尝试！"
action-bar-message: "&c残缺垂滴叶禁止使用骨粉！请勿尝试！"

# [action-bar-stay] ActionBar 持续时间
# 作用：客户端原生 ActionBar 只显示约 2 秒；该项配置更长时，
#       插件每 1 秒自动重发一次来实现持续显示，到时自动停止
# 单位：tick
# 取值：0 = 只显示一次（原生约 2 秒）；上限 400（20 秒），超出自动夹取
# 默认：60（3 秒）
action-bar-stay: 60


# ------------------------------------------------------------------
#  六、Toast 右上角成就弹窗
# ------------------------------------------------------------------

# [toast-enabled] Toast 开关
# 作用：拦截成功时向触发玩家弹出屏幕右上角的成就式弹窗
# 取值：true = 弹出；false = 不弹出
# 默认：true
# 注意：同一玩家两次弹窗之间有 10 秒间隔（成就需先撤销才能重新弹出），
#       期间拦截照常进行，只是不重复弹窗
toast-enabled: true

# [toast-title] Toast 标题
# 作用：弹窗第一行文本
# 格式：字符串，支持 & 颜色代码
# 默认："&c刷物品BUG行为已被拦截"
# 注意：Toast 为全服共享成就，不支持 %player% 等占位符
toast-title: "&c刷物品BUG行为已被拦截"

# [toast-description] Toast 描述
# 作用：弹窗第二行（灰字）文本
# 格式：字符串，支持 & 颜色代码
# 默认："&7残缺垂滴叶禁止使用骨粉"
# 注意：同上，不支持占位符
toast-description: "&7残缺垂滴叶禁止使用骨粉"

# [toast-icon] Toast 图标
# 作用：弹窗左侧显示的物品图标
# 取值：任意合法物品 Material 名称（大写枚举名，如 BARRIER / NETHER_STAR / TNT），
#       非物品或非法名称自动回退 BARRIER
# 默认：BARRIER
toast-icon: BARRIER

# [toast-frame] Toast 框架颜色
# 作用：弹窗的成就框架类型，决定标题颜色与弹出音效
# 取值：TASK（灰色，普通成就）/ GOAL（绿色，目标）/ CHALLENGE（紫色，挑战，推荐）
#       非法值自动回退 CHALLENGE
# 默认：CHALLENGE
toast-frame: CHALLENGE


# ------------------------------------------------------------------
#  七、Narrator 旁白朗读（无障碍）
# ------------------------------------------------------------------

# [narrator-enabled] Narrator 开关
# 作用：拦截成功时向触发玩家发送一条系统消息，
#       玩家客户端开启“旁白/无障碍朗读”（设置 -> 辅助功能 -> 旁白）后会被自动朗读
# 取值：true = 发送；false = 不发送
# 默认：true
# 注意：旁白由客户端 TTS 播报，服务端无法强制玩家开启或关闭，
#       未开启旁白的玩家只会看到一条普通系统消息（或被聊天设置隐藏）
narrator-enabled: true

# [narrator-message] 旁白文本
# 作用：被朗读的内容（纯文本即可，颜色代码无意义）
# 格式：字符串，支持占位符
# 默认："警告：检测到刷物品BUG行为，请勿对残缺垂滴叶使用骨粉！"
narrator-message: "警告：检测到刷物品BUG行为，请勿对残缺垂滴叶使用骨粉！"


# ------------------------------------------------------------------
#  八、BossBar 屏幕顶部血条式提示
# ------------------------------------------------------------------

# [boss-bar-enabled] BossBar 开关
# 作用：拦截成功时向触发玩家顶部显示紫色血条式提示条，按 stay 时长倒计时并同步进度条
# 取值：true = 显示；false = 不显示
# 默认：true
boss-bar-enabled: true

# [boss-bar-text] BossBar 文本
# 作用：血条上显示的文字
# 格式：字符串，支持 & 颜色代码与占位符
# 默认："&c残缺垂滴叶禁止使用骨粉！"
boss-bar-text: "&c残缺垂滴叶禁止使用骨粉！"

# [boss-bar-color] BossBar 颜色
# 取值：PINK / BLUE / RED / GREEN / YELLOW / PURPLE / WHITE，非法值自动回退 RED
# 默认：RED
boss-bar-color: RED

# [boss-bar-style] BossBar 分段样式
# 取值：SOLID（实心）/ SEGMENTED_6 / SEGMENTED_10 / SEGMENTED_12 / SEGMENTED_20
#       （数字为分段数，带 _NOTCHED_ 的为刻度线样式，如 SEGMENTED_6_NOTCHED_10），
#       非法值自动回退 SOLID
# 默认：SOLID
boss-bar-style: SOLID

# [boss-bar-stay] BossBar 显示时长
# 作用：血条显示的总时长，期间进度条从 100% 线性递减，到时自动移除；
#       拦截再次命中时会重置为新的一次显示
# 单位：tick，取值 20 ~ 1200，超出自动夹取
# 默认：60（3 秒）
boss-bar-stay: 60
